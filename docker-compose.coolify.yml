services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.coolify
      - .env.db.coolify
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import os,socket; s=socket.create_connection(('127.0.0.1', int(os.getenv('API_PORT','8000'))),2); s.close()"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app_net
    labels:
      - traefik.enable=true
      - coolify.managed=true

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.db.coolify
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -h 127.0.0.1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_net

volumes:
  postgres_data:

networks:
  app_net:
    driver: bridge
