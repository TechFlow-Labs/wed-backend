services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wedding_plan}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./sql/01-wedding-plan-schema-prod.sql:/docker-entrypoint-initdb.d/01-pg-schema.sql:ro
      - wedding-plan-database-prod:/var/lib/postgresql/data
    ports:
      - "5492:5432"
    restart: unless-stopped
    networks:
      - app

  backend:
    build:
      context: ./src/app/
      dockerfile: Dockerfile.api_prod
    depends_on:
      - postgres
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/wedding_plan}
      PORT: ${PORT:-8000}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8081}
    ports:
      - "8002:8000"
    restart: unless-stopped
    networks:
      - app

volumes:
  wedding-plan-database-prod:

networks:
  app:
