name: Coolify Preview Orchestrator

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: coolify-preview-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  notify-orchestrator:
    runs-on: ubuntu-latest
    env:
      ORCHESTRATOR_URL: ${{ secrets.PREVIEW_ORCHESTRATOR_URL }}
      ORCHESTRATOR_TOKEN: ${{ secrets.PREVIEW_ORCHESTRATOR_TOKEN }}
    steps:
      - name: Validate orchestrator configuration
        run: |
          if [ -z "$ORCHESTRATOR_URL" ]; then
            echo "Missing required secret: PREVIEW_ORCHESTRATOR_URL"
            exit 1
          fi

      - name: Compute preview key
        id: key
        shell: bash
        run: |
          set -euo pipefail
          RAW="${{ github.event.pull_request.head.ref }}"
          KEY=$(echo "$RAW" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//; s/-+/-/g')

          if [ -z "$KEY" ]; then
            KEY="pr-${{ github.event.pull_request.number }}"
          fi

          echo "preview_key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Select action
        id: action
        shell: bash
        run: |
          case "${{ github.event.action }}" in
            closed)
              echo "action=teardown" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "action=deploy" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Notify preview orchestrator
        shell: bash
        run: |
          set -euo pipefail

          PAYLOAD=$(cat <<JSON
          {
            "action": "${{ steps.action.outputs.action }}",
            "preview_key": "${{ steps.key.outputs.preview_key }}",
            "trigger_repo": "${{ github.repository }}",
            "pull_request_number": ${{ github.event.pull_request.number }},
            "branch": "${{ github.event.pull_request.head.ref }}",
            "base_branch": "${{ github.event.pull_request.base.ref }}",
            "sha": "${{ github.event.pull_request.head.sha }}",
            "actor": "${{ github.actor }}",
            "event_action": "${{ github.event.action }}"
          }
          JSON
          )

          if [ -n "$ORCHESTRATOR_TOKEN" ]; then
            curl -fsSL -X POST "$ORCHESTRATOR_URL" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $ORCHESTRATOR_TOKEN" \
              --data "$PAYLOAD"
          else
            curl -fsSL -X POST "$ORCHESTRATOR_URL" \
              -H "Content-Type: application/json" \
              --data "$PAYLOAD"
          fi
