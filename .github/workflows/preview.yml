name: Preview Deployment

on:
  push:
    branches-ignore:
      - main
      - master
  delete:
  pull_request:
    types: [closed]

concurrency:
  group: preview-backend-${{ github.head_ref || github.ref_name || github.event.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy backend preview
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}

    steps:
      - name: Compute preview identifiers
        id: vars
        run: |
          BRANCH="${{ github.ref_name }}"
          SLUG=$(echo "$BRANCH" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]/-/g' \
            | sed 's/-\+/-/g' \
            | sed 's/^-//;s/-$//')
          echo "slug=${SLUG}"                                           >> "$GITHUB_OUTPUT"
          echo "app_name=backend-prev-${SLUG}"                         >> "$GITHUB_OUTPUT"
          echo "fqdn=https://${SLUG}-api.${{ vars.PREVIEW_DOMAIN }}"   >> "$GITHUB_OUTPUT"

      - name: Find or create Coolify application
        id: app
        run: |
          APP_NAME="${{ steps.vars.outputs.app_name }}"

          APPS=$(curl -sf "${COOLIFY_URL}/api/v1/applications" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}")

          UUID=$(echo "$APPS" | jq -r --arg n "$APP_NAME" \
            '.[] | select(.name == $n) | .uuid // empty' | head -1)

          if [ -z "$UUID" ]; then
            BODY=$(jq -n \
              --arg proj   "${{ secrets.COOLIFY_PROJECT_UUID }}" \
              --arg srv    "${{ secrets.COOLIFY_SERVER_UUID }}" \
              --argjson source_id 4 \
              --arg branch "${{ github.ref_name }}" \
              --arg name   "$APP_NAME" \
              --arg fqdn   "${{ steps.vars.outputs.fqdn }}" \
              '{
                project_uuid:            $proj,
                server_uuid:             $srv,
                environment_name:        "preview",
                source_id:               $source_id,
                source_type:             "App\\Models\\GithubApp",
                git_repository:          "TechFlow-Labs/wed-backend",
                git_branch:              $branch,
                build_pack:              "docker-compose",
                docker_compose_location: "/docker-compose.preview.yml",
                name:                    $name,
                fqdn:                    $fqdn,
                instant_deploy:          false
              }')

            RESP=$(curl -s -X POST "${COOLIFY_URL}/api/v1/applications" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$BODY")
            echo "Coolify response: $RESP"

            UUID=$(echo "$RESP" | jq -r '.uuid // empty')
            if [ -z "$UUID" ] || [ "$UUID" = "null" ]; then
              echo "ERROR: Failed to create Coolify app"
              exit 1
            fi
          fi

          echo "uuid=${UUID}" >> "$GITHUB_OUTPUT"

      - name: Sync environment variables
        run: |
          curl -sf -X PATCH \
            "${COOLIFY_URL}/api/v1/applications/${{ steps.app.outputs.uuid }}/envs/bulk" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg db_pass   "${{ secrets.PREVIEW_DB_PASSWORD }}" \
              --arg db_user   "${{ vars.PREVIEW_DB_USER }}" \
              --arg db_name   "${{ vars.PREVIEW_DB_NAME }}" \
              --arg jwt       "${{ secrets.PREVIEW_JWT_SECRET }}" \
              --arg mail_user "${{ secrets.PREVIEW_MAIL_USERNAME }}" \
              --arg mail_pass "${{ secrets.PREVIEW_MAIL_PASSWORD }}" \
              --arg mail_from "${{ vars.PREVIEW_MAIL_FROM }}" \
              --arg mail_port "${{ vars.PREVIEW_MAIL_PORT }}" \
              --arg mail_srv  "${{ vars.PREVIEW_MAIL_SERVER }}" \
              '{data: [
                {key: "DB_PASSWORD",    value: $db_pass},
                {key: "DB_USER",        value: $db_user},
                {key: "DB_DATABASE",    value: $db_name},
                {key: "JWT_SECRET_KEY", value: $jwt},
                {key: "MAIL_USERNAME",  value: $mail_user},
                {key: "MAIL_PASSWORD",  value: $mail_pass},
                {key: "MAIL_FROM",      value: $mail_from},
                {key: "MAIL_PORT",      value: $mail_port},
                {key: "MAIL_SERVER",    value: $mail_srv}
              ]}')"

      - name: Trigger deployment
        run: |
          curl -sf -X POST \
            "${COOLIFY_URL}/api/v1/deploy?uuid=${{ steps.app.outputs.uuid }}&force=false" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}"

      - name: Deployment summary
        run: |
          echo "### Backend Preview Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** ${{ steps.vars.outputs.fqdn }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: Delete backend preview
    if: |
      (github.event_name == 'delete' && github.event.ref_type == 'branch') ||
      (github.event_name == 'pull_request' && github.event.action == 'closed')
    runs-on: ubuntu-latest
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}

    steps:
      - name: Compute app name
        id: vars
        run: |
          BRANCH="${{ github.head_ref || github.event.ref }}"
          SLUG=$(echo "$BRANCH" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]/-/g' \
            | sed 's/-\+/-/g' \
            | sed 's/^-//;s/-$//')
          echo "app_name=backend-prev-${SLUG}" >> "$GITHUB_OUTPUT"

      - name: Delete Coolify application
        run: |
          APP_NAME="${{ steps.vars.outputs.app_name }}"

          APPS=$(curl -sf "${COOLIFY_URL}/api/v1/applications" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}")

          UUID=$(echo "$APPS" | jq -r --arg n "$APP_NAME" \
            '.[] | select(.name == $n) | .uuid // empty' | head -1)

          if [ -n "$UUID" ]; then
            curl -sf -X DELETE \
              "${COOLIFY_URL}/api/v1/applications/${UUID}?delete_configurations=true&delete_volumes=true" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}"
            echo "Deleted: ${APP_NAME} (${UUID})"
          else
            echo "Not found: ${APP_NAME} (already cleaned up?)"
          fi
