name: Preview Deployment

on:
  push:
    branches-ignore:
      - main
      - master
  delete:
  pull_request:
    types: [closed]

# One run per branch at a time; never cancel in-progress (avoids torn deployments).
concurrency:
  group: preview-${{ github.head_ref || github.ref_name || github.event.ref }}
  cancel-in-progress: false

jobs:
  # ── Deploy ────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy preview
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}

    steps:
      - name: Compute preview identifiers
        id: vars
        run: |
          BRANCH="${{ github.ref_name }}"
          SLUG=$(echo "$BRANCH" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]/-/g' \
            | sed 's/-\+/-/g' \
            | sed 's/^-//;s/-$//')
          echo "branch=$BRANCH"          >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG"             >> "$GITHUB_OUTPUT"
          echo "app_name=preview-$SLUG" >> "$GITHUB_OUTPUT"

      # Check which repos actually have this branch; fall back to main per service.
      - name: Resolve live branch per service
        id: branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.vars.outputs.branch }}"

          branch_or_main() {
            local repo="$1"
            gh api "repos/techflow-labs/${repo}/branches/${BRANCH}" \
              --silent 2>/dev/null && echo "$BRANCH" || echo "main"
          }

          echo "ssr=$(branch_or_main wed-ssr-mvp)"       >> "$GITHUB_OUTPUT"
          echo "backend=$(branch_or_main wed-backend)"   >> "$GITHUB_OUTPUT"
          echo "main_app=$(branch_or_main wed-main-mvp)" >> "$GITHUB_OUTPUT"

      # Find an existing preview app for this branch slug, or create a fresh one.
      - name: Find or create Coolify preview application
        id: app
        run: |
          APP_NAME="${{ steps.vars.outputs.app_name }}"

          APPS=$(curl -sf "${COOLIFY_URL}/api/v1/applications" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}")

          UUID=$(echo "$APPS" | jq -r --arg n "$APP_NAME" \
            '.[] | select(.name == $n) | .uuid // empty' | head -1)

          if [ -z "$UUID" ]; then
            BODY=$(jq -n \
              --arg proj  "${{ secrets.COOLIFY_PROJECT_UUID }}" \
              --arg srv   "${{ secrets.COOLIFY_SERVER_UUID }}" \
              --arg ghapp "${{ secrets.COOLIFY_GITHUB_APP_UUID }}" \
              --arg name  "$APP_NAME" \
              --arg fqdn  "https://${{ steps.vars.outputs.slug }}.${{ vars.PREVIEW_DOMAIN }}" \
              '{
                project_uuid:            $proj,
                server_uuid:             $srv,
                environment_name:        "preview",
                github_app_uuid:         $ghapp,
                git_repository:          "techflow-labs/wed-ssr-mvp",
                git_branch:              "main",
                build_pack:              "docker-compose",
                docker_compose_location: "/docker-compose.coolify.yml",
                name:                    $name,
                fqdn:                    $fqdn,
                instant_deploy:          false
              }')

            RESP=$(curl -sf -X POST "${COOLIFY_URL}/api/v1/applications/github-app" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$BODY")

            UUID=$(echo "$RESP" | jq -r '.uuid')
          fi

          echo "uuid=$UUID" >> "$GITHUB_OUTPUT"

      # Push all branch + secret env vars as a single bulk update.
      - name: Sync environment variables
        run: |
          curl -sf -X PATCH \
            "${COOLIFY_URL}/api/v1/applications/${{ steps.app.outputs.uuid }}/envs/bulk" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg ssr       "${{ steps.branches.outputs.ssr }}" \
              --arg backend   "${{ steps.branches.outputs.backend }}" \
              --arg main_app  "${{ steps.branches.outputs.main_app }}" \
              --arg gh_token  "${{ secrets.PREVIEW_GITHUB_TOKEN }}" \
              --arg db_pass   "${{ secrets.PREVIEW_DB_PASSWORD }}" \
              --arg db_user   "${{ vars.PREVIEW_DB_USER }}" \
              --arg db_name   "${{ vars.PREVIEW_DB_NAME }}" \
              --arg jwt       "${{ secrets.PREVIEW_JWT_SECRET }}" \
              --arg mail_user "${{ secrets.PREVIEW_MAIL_USERNAME }}" \
              --arg mail_pass "${{ secrets.PREVIEW_MAIL_PASSWORD }}" \
              --arg mail_from "${{ vars.PREVIEW_MAIL_FROM }}" \
              --arg mail_port "${{ vars.PREVIEW_MAIL_PORT }}" \
              --arg mail_srv  "${{ vars.PREVIEW_MAIL_SERVER }}" \
              '{data: [
                {key: "SSR_BRANCH",     value: $ssr,       is_build_time: true},
                {key: "BACKEND_BRANCH", value: $backend,   is_build_time: true},
                {key: "MAIN_BRANCH",    value: $main_app,  is_build_time: true},
                {key: "GITHUB_TOKEN",   value: $gh_token,  is_build_time: true},
                {key: "DB_PASSWORD",    value: $db_pass},
                {key: "DB_USER",        value: $db_user},
                {key: "DB_DATABASE",    value: $db_name},
                {key: "JWT_SECRET_KEY", value: $jwt},
                {key: "MAIL_USERNAME",  value: $mail_user},
                {key: "MAIL_PASSWORD",  value: $mail_pass},
                {key: "MAIL_FROM",      value: $mail_from},
                {key: "MAIL_PORT",      value: $mail_port},
                {key: "MAIL_SERVER",    value: $mail_srv}
              ]}')"

      - name: Trigger deployment
        run: |
          curl -sf -X POST \
            "${COOLIFY_URL}/api/v1/deploy?uuid=${{ steps.app.outputs.uuid }}&force=false" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}"

      - name: Deployment summary
        run: |
          echo "### Preview Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service    | Branch |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| SSR (web)  | \`${{ steps.branches.outputs.ssr }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Backend    | \`${{ steps.branches.outputs.backend }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Main (app) | \`${{ steps.branches.outputs.main_app }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** https://${{ steps.vars.outputs.slug }}.${{ vars.PREVIEW_DOMAIN }}" >> "$GITHUB_STEP_SUMMARY"

  # ── Cleanup ───────────────────────────────────────────────────────────────
  cleanup:
    name: Delete preview
    if: |
      (github.event_name == 'delete' && github.event.ref_type == 'branch') ||
      (github.event_name == 'pull_request' && github.event.action == 'closed')
    runs-on: ubuntu-latest
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}

    steps:
      - name: Compute app name
        id: vars
        run: |
          BRANCH="${{ github.head_ref || github.event.ref }}"
          SLUG=$(echo "$BRANCH" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]/-/g' \
            | sed 's/-\+/-/g' \
            | sed 's/^-//;s/-$//')
          echo "app_name=preview-$SLUG" >> "$GITHUB_OUTPUT"

      - name: Delete Coolify application
        run: |
          APP_NAME="${{ steps.vars.outputs.app_name }}"

          APPS=$(curl -sf "${COOLIFY_URL}/api/v1/applications" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}")

          UUID=$(echo "$APPS" | jq -r --arg n "$APP_NAME" \
            '.[] | select(.name == $n) | .uuid // empty' | head -1)

          if [ -n "$UUID" ]; then
            curl -sf -X DELETE \
              "${COOLIFY_URL}/api/v1/applications/${UUID}?delete_configurations=true&delete_volumes=true" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}"
            echo "Deleted: $APP_NAME ($UUID)"
          else
            echo "Not found: $APP_NAME (already cleaned up?)"
          fi
